[flake8]
max-line-length = 79
exclude = .git,__pycache__,saves,tests/solutions
# Lesson texts are long French paragraphs: line length is not enforced there.
per-file-ignores =
    server/curriculum/r*.py:E501
    server/curriculum/scenes.py:E501
    server/curriculum/experiments.py:E501

[mypy]
python_version = 3.10
warn_unused_ignores = False
ignore_missing_imports = True
